<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishon Golf Fitting Calculator</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1a365d; text-align: center; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 1rem; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568; }
        input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .result-box { margin-top: 2rem; padding: 1.5rem; background-color: #f7fafc; border-radius: 10px; border: 1px solid #e2e8f0; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px dashed #edf2f7; }
        .result-item:last-child { border-bottom: none; }
        .label { color: #718096; }
        .value { font-weight: 700; color: #2d3748; }
        .highlight { color: #3182ce; }
        button { width: 100%; padding: 1rem; background-color: #3182ce; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>

<div class="container">
    <h2>아이언 피팅 계산기</h2>
    
    <div class="input-group">
        <label>신장 (cm)</label>
        <input type="number" id="heightCm" placeholder="예: 175" step="0.1">
    </div>
    
    <div class="input-group">
        <label>손목-지면 높이 (WTF, cm)</label>
        <input type="number" id="wtfCm" placeholder="예: 85" step="0.1">
    </div>
    
    <button onclick="calculateFitting()">분석하기</button>

    <div id="result" class="result-box">
        <div class="result-item">
            <span class="label">환산 신장 (ft/in)</span>
            <span id="resHeight" class="value"></span>
        </div>
        <div class="result-item">
            <span class="label">환산 WTF (inch)</span>
            <span id="resWtf" class="value"></span>
        </div>
        <div class="result-item">
            <span class="label">권장 7번 길이</span>
            <span id="resLength" class="value highlight"></span>
        </div>
        <div class="result-item">
            <span class="label">라이각 보정</span>
            <span id="resLie" class="value highlight"></span>
        </div>
        <div class="result-item">
            <span class="label">표준 대비 가감</span>
            <span id="resOffset" class="value"></span>
        </div>
    </div>
</div>

<script>
function calculateFitting() {
    const hCm = document.getElementById('heightCm').value;
    const wCm = document.getElementById('wtfCm').value;
    
    if(!hCm || !wCm) { alert('수치를 입력해주세요.'); return; }

    const hIn = hCm / 2.54;
    const wIn = wCm / 2.54;
    
    const ft = Math.floor(hIn / 12);
    const inch = Math.round(hIn % 12);
    
    // 단순화된 Wishon 로직 시뮬레이션
    // 실제 차트 데이터 베이스를 기반으로 한 근사치 계산
    let lengthOffset = 0;
    let lieAdj = 0;

    // WTF 기준 길이 설정
    if (wIn < 31.5) lengthOffset = -0.5;
    else if (wIn > 35.5) lengthOffset = 0.5;
    else lengthOffset = 0;

    // 신장 및 WTF 기반 라이각 추정
    if (wIn < 30) lieAdj = -2; // Flat
    else if (wIn > 37) lieAdj = 2; // Upright
    else lieAdj = 0; // Standard

    const finalLengthIn = 37 + lengthOffset;
    const finalLengthCm = (finalLengthIn * 2.54).toFixed(1);

    document.getElementById('resHeight').innerText = `${ft}' ${inch}"`;
    document.getElementById('resWtf').innerText = `${wIn.toFixed(1)}"`;
    document.getElementById('resLength').innerText = `${finalLengthIn}" (${finalLengthCm} cm)`;
    document.getElementById('resLie').innerText = lieAdj === 0 ? "Standard" : (lieAdj > 0 ? `+${lieAdj}° Upright` : `${lieAdj}° Flat`);
    document.getElementById('resOffset').innerText = lengthOffset === 0 ? "Standard" : `${lengthOffset > 0 ? '+' : ''}${lengthOffset}"`;
    
    document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
